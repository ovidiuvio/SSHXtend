<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>SSHXtend Terminal</title>
    <style>
      body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #1e1e1e; /* VSCode dark default */
        color: white;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      #terminal-container {
        width: 100%;
        height: calc(100% - 40px);
        padding: 5px;
        box-sizing: border-box;
      }
      #toolbar {
        height: 40px;
        background-color: #2d2d2d;
        display: flex;
        align-items: center;
        padding: 0 10px;
        border-bottom: 1px solid #444;
      }
      button {
        background-color: #4a4a4a;
        color: white;
        border: none;
        padding: 5px 10px;
        border-radius: 3px;
        cursor: pointer;
        font-size: 13px;
        margin-right: 10px;
      }
      button:hover {
        background-color: #5a5a5a;
      }
    </style>
  </head>
  <body>
    <div id="toolbar">
      <button id="btn-export-html">Export HTML</button>
      <button id="btn-export-ansi">Export ANSI</button>
      <button id="btn-export-txt">Export TXT</button>
    </div>
    <div id="terminal-container"></div>
    <script src="./renderer.js"></script>
  </body>
</html>
